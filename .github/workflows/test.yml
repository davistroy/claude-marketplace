name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov jsonschema pyyaml

      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  # Additional job for bpmn2drawio tests
  bpmn2drawio:
    name: BPMN2DrawIO Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/bpmn-plugin/tools/bpmn2drawio

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=bpmn2drawio --cov-branch --cov-report=term-missing

      - name: Type check
        run: |
          # Hard zero-errors gate: all three tools are mypy-clean (D24/#129),
          # so mypy runs bare and any error fails the build. Fix new errors, or
          # add a scoped `# type: ignore[code]` with a reason — no baseline ratchet.
          mypy src/ --ignore-missing-imports

  visual-explainer:
    name: Visual Explainer Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/personal-plugin/tools/visual-explainer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=visual_explainer --cov-branch --cov-report=term-missing

      - name: Type check
        run: |
          # Hard zero-errors gate: all three tools are mypy-clean (D24/#129),
          # so mypy runs bare and any error fails the build. Fix new errors, or
          # add a scoped `# type: ignore[code]` with a reason — no baseline ratchet.
          mypy src/ --ignore-missing-imports

  feedback-docx-generator:
    name: Feedback DOCX Generator Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/personal-plugin/tools/feedback-docx-generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=feedback_docx_generator --cov-branch --cov-report=term-missing

      - name: Type check
        run: |
          mypy src/ --ignore-missing-imports

  # REQUIRED: both matrix legs ("Task Sync Tests (ubuntu-latest)" and
  # "(windows-latest)") are in branch protection's required-check list, added
  # in Phase 6 of the task-sync build-out once the job had proven green over
  # several phases. It was deliberately non-required before that, so a
  # not-yet-existing required check could not deadlock the PR creating it.
  task-sync:
    name: Task Sync Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/personal-plugin/tools/task-sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=task_sync --cov-branch --cov-report=term-missing

      - name: Type check
        run: |
          mypy src/ --ignore-missing-imports

  # NON-REQUIRED for now, deliberately, following the task-sync precedent
  # directly above: a required check cannot exist before the PR that creates
  # it, so adding it to branch protection in the same change would deadlock
  # that very PR. Promote both matrix legs ("Research SSE Tests (ubuntu-latest)"
  # and "(windows-latest)") to required once the job has proven green.
  research-sse:
    name: Research SSE Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/personal-plugin/tools/research-sse

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=research_sse --cov-branch --cov-report=term-missing

      - name: Type check
        run: |
          mypy src/ --ignore-missing-imports

  # Advisory (NON-required) Python 3.10/3.12 compatibility check. All three
  # tools declare requires-python >=3.10 but CI otherwise only exercises 3.11.
  # This is a SEPARATE job with distinct check names ("Python Compat (3.10)")
  # so it is NOT one of the branch-protection required contexts: expanding the
  # required Run Tests / tool-test matrices would rename their check names and
  # deadlock merges until branch protection is updated in lockstep (PLAT-012 /
  # LAB_NOTEBOOK D28 / #130). Failures here surface on the PR but do not block.
  # ubuntu-only: compatibility is a Python-version concern; the required jobs
  # already cover Windows on 3.11.
  python-compat:
    name: Python Compat (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: visual-explainer tests
        working-directory: plugins/personal-plugin/tools/visual-explainer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
          pytest tests/ -q -p no:cacheprovider --cov-fail-under=0

      - name: bpmn2drawio tests
        working-directory: plugins/bpmn-plugin/tools/bpmn2drawio
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q -p no:cacheprovider --cov-fail-under=0

      - name: feedback-docx-generator tests
        working-directory: plugins/personal-plugin/tools/feedback-docx-generator
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q -p no:cacheprovider --cov-fail-under=0

      - name: task-sync tests
        working-directory: plugins/personal-plugin/tools/task-sync
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q -p no:cacheprovider --cov-fail-under=0

      - name: research-sse tests
        working-directory: plugins/personal-plugin/tools/research-sse
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q -p no:cacheprovider --cov-fail-under=0

  # pip-audit scans installed Python packages for known CVEs.
  # It checks the NIST NVD and PyPI advisory databases.
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit for all tool dependencies
        run: |
          # Audit ONLY each tool's pinned, declared dependencies (its
          # requirements-lock.txt), not the ambient runner environment.
          # Scanning the whole env previously meant a runner-shipped build
          # tool (e.g. a stale setuptools CVE) could fail the gate on PRs
          # that never touch that dependency at all.
          pip-audit --requirement plugins/bpmn-plugin/tools/bpmn2drawio/requirements-lock.txt
          pip-audit --requirement plugins/personal-plugin/tools/visual-explainer/requirements-lock.txt
          pip-audit --requirement plugins/personal-plugin/tools/feedback-docx-generator/requirements-lock.txt
          pip-audit --requirement plugins/personal-plugin/tools/task-sync/requirements-lock.txt
          pip-audit --requirement plugins/personal-plugin/tools/research-sse/requirements-lock.txt

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate JSON schemas are valid
        run: |
          python -c "
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_dir = Path('schemas')
          for schema_file in schema_dir.glob('*.json'):
              print(f'Validating {schema_file.name}...')
              with open(schema_file) as f:
                  schema = json.load(f)
              Draft202012Validator.check_schema(schema)
              print(f'  {schema_file.name} is valid')

          print('All schemas are valid!')
          "

      - name: Validate data against schemas
        run: |
          python scripts/validate_schema_data.py
