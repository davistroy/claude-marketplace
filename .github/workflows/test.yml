name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov jsonschema pyyaml

      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  # Additional job for bpmn2drawio tests
  bpmn2drawio:
    name: BPMN2DrawIO Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/bpmn-plugin/tools/bpmn2drawio

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=bpmn2drawio --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Type check (count-ratchet against baseline)
        shell: bash
        run: |
          # The codebase has pre-existing mypy debt (54 errors here as of 2026-07-16).
          # Zeroing it out is out of scope for now, so instead of ignoring mypy
          # entirely (continue-on-error) we enforce a regression CEILING: new
          # errors above the committed baseline fail the build. Tighten
          # .mypy-baseline toward 0 over time as errors are fixed.
          BASELINE=$(cat .mypy-baseline)
          set +e
          MYPY_OUTPUT=$(mypy src/ --ignore-missing-imports 2>&1)
          set -e
          echo "$MYPY_OUTPUT"
          ERRORS=$(echo "$MYPY_OUTPUT" | grep -oP 'Found \K[0-9]+(?= error)' || echo 0)
          echo "mypy errors: $ERRORS (baseline ceiling: $BASELINE)"
          if [ "$ERRORS" -gt "$BASELINE" ]; then
            echo "::error::mypy error count ($ERRORS) exceeds baseline ceiling ($BASELINE). Fix the new error(s) or, if intentional, raise .mypy-baseline with justification."
            exit 1
          fi
          echo "OK: $ERRORS <= baseline $BASELINE"

  visual-explainer:
    name: Visual Explainer Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/personal-plugin/tools/visual-explainer

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=visual_explainer --cov-branch --cov-report=term-missing --cov-fail-under=65

      - name: Type check (count-ratchet against baseline)
        shell: bash
        run: |
          # The codebase has pre-existing mypy debt (98 errors here as of 2026-07-16).
          # Zeroing it out is out of scope for now, so instead of ignoring mypy
          # entirely (continue-on-error) we enforce a regression CEILING: new
          # errors above the committed baseline fail the build. Tighten
          # .mypy-baseline toward 0 over time as errors are fixed.
          BASELINE=$(cat .mypy-baseline)
          set +e
          MYPY_OUTPUT=$(mypy src/ --ignore-missing-imports 2>&1)
          set -e
          echo "$MYPY_OUTPUT"
          ERRORS=$(echo "$MYPY_OUTPUT" | grep -oP 'Found \K[0-9]+(?= error)' || echo 0)
          echo "mypy errors: $ERRORS (baseline ceiling: $BASELINE)"
          if [ "$ERRORS" -gt "$BASELINE" ]; then
            echo "::error::mypy error count ($ERRORS) exceeds baseline ceiling ($BASELINE). Fix the new error(s) or, if intentional, raise .mypy-baseline with justification."
            exit 1
          fi
          echo "OK: $ERRORS <= baseline $BASELINE"

  feedback-docx-generator:
    name: Feedback DOCX Generator Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/personal-plugin/tools/feedback-docx-generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v -n auto --cov=feedback_docx_generator --cov-branch --cov-report=term-missing --cov-fail-under=95

      - name: Type check
        run: |
          mypy src/ --ignore-missing-imports

  # pip-audit scans installed Python packages for known CVEs.
  # It checks the NIST NVD and PyPI advisory databases.
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit for all tool dependencies
        run: |
          # Audit ONLY each tool's pinned, declared dependencies (its
          # requirements-lock.txt), not the ambient runner environment.
          # Scanning the whole env previously meant a runner-shipped build
          # tool (e.g. a stale setuptools CVE) could fail the gate on PRs
          # that never touch that dependency at all.
          pip-audit --requirement plugins/bpmn-plugin/tools/bpmn2drawio/requirements-lock.txt
          pip-audit --requirement plugins/personal-plugin/tools/visual-explainer/requirements-lock.txt
          pip-audit --requirement plugins/personal-plugin/tools/feedback-docx-generator/requirements-lock.txt

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate JSON schemas are valid
        run: |
          python -c "
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_dir = Path('schemas')
          for schema_file in schema_dir.glob('*.json'):
              print(f'Validating {schema_file.name}...')
              with open(schema_file) as f:
                  schema = json.load(f)
              Draft202012Validator.check_schema(schema)
              print(f'  {schema_file.name} is valid')

          print('All schemas are valid!')
          "

      - name: Validate data against schemas
        run: |
          python scripts/validate_schema_data.py
