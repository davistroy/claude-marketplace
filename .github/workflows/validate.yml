name: Plugin Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema pyyaml

      - name: Validate plugin.json files
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys

          errors = []
          plugins_dir = Path('plugins')

          for plugin_dir in plugins_dir.iterdir():
              if not plugin_dir.is_dir():
                  continue

              plugin_json = plugin_dir / '.claude-plugin' / 'plugin.json'
              if not plugin_json.exists():
                  errors.append(f'{plugin_dir.name}: Missing plugin.json')
                  continue

              try:
                  with open(plugin_json) as f:
                      data = json.load(f)

                  # Check required fields
                  for field in ['name', 'description', 'version']:
                      if field not in data:
                          errors.append(f'{plugin_dir.name}: Missing required field \"{field}\" in plugin.json')

                  # Validate semver format
                  if 'version' in data:
                      import re
                      if not re.match(r'^\d+\.\d+\.\d+$', data['version']):
                          errors.append(f'{plugin_dir.name}: Invalid version format \"{data[\"version\"]}\" (expected X.Y.Z)')

                  print(f'{plugin_dir.name}: plugin.json valid')

              except json.JSONDecodeError as e:
                  errors.append(f'{plugin_dir.name}: Invalid JSON in plugin.json - {e}')

          if errors:
              print('\nValidation errors:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)
          else:
              print('\nAll plugin.json files are valid!')
          "

      - name: Validate command frontmatter
        run: |
          python -c "
          import yaml
          from pathlib import Path
          import sys

          errors = []
          warnings = []
          plugins_dir = Path('plugins')

          for plugin_dir in plugins_dir.iterdir():
              if not plugin_dir.is_dir():
                  continue

              for subdir in ['commands', 'skills']:
                  cmd_dir = plugin_dir / subdir
                  if not cmd_dir.exists():
                      continue

                  for md_file in cmd_dir.glob('*.md'):
                      try:
                          content = md_file.read_text(encoding='utf-8')

                          # Check for frontmatter
                          if not content.startswith('---'):
                              errors.append(f'{md_file.relative_to(\".\")}: Missing frontmatter delimiters')
                              continue

                          # Extract frontmatter
                          parts = content.split('---', 2)
                          if len(parts) < 3:
                              errors.append(f'{md_file.relative_to(\".\")}: Invalid frontmatter structure')
                              continue

                          frontmatter = yaml.safe_load(parts[1])

                          if frontmatter is None:
                              errors.append(f'{md_file.relative_to(\".\")}: Empty frontmatter')
                              continue

                          # Check required field
                          if 'description' not in frontmatter:
                              errors.append(f'{md_file.relative_to(\".\")}: Missing required field \"description\"')

                          # Check forbidden field
                          if 'name' in frontmatter:
                              errors.append(f'{md_file.relative_to(\".\")}: Contains forbidden \"name\" field (filename determines command name)')

                          print(f'{md_file.relative_to(\".\")}: frontmatter valid')

                      except yaml.YAMLError as e:
                          errors.append(f'{md_file.relative_to(\".\")}: Invalid YAML in frontmatter - {e}')
                      except Exception as e:
                          errors.append(f'{md_file.relative_to(\".\")}: Error reading file - {e}')

          if errors:
              print('\nValidation errors:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)
          else:
              print('\nAll command frontmatter is valid!')
          "

      - name: Validate version synchronization
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys

          errors = []

          # Load marketplace.json
          marketplace_path = Path('.claude-plugin/marketplace.json')
          if not marketplace_path.exists():
              print('No marketplace.json found, skipping version sync check')
              sys.exit(0)

          with open(marketplace_path) as f:
              marketplace = json.load(f)

          marketplace_plugins = {p['name']: p for p in marketplace.get('plugins', [])}

          # Check each plugin
          plugins_dir = Path('plugins')
          for plugin_dir in plugins_dir.iterdir():
              if not plugin_dir.is_dir():
                  continue

              plugin_json_path = plugin_dir / '.claude-plugin' / 'plugin.json'
              if not plugin_json_path.exists():
                  continue

              with open(plugin_json_path) as f:
                  plugin_data = json.load(f)

              plugin_name = plugin_data.get('name', plugin_dir.name)
              plugin_version = plugin_data.get('version')

              if plugin_name in marketplace_plugins:
                  marketplace_version = marketplace_plugins[plugin_name].get('version')
                  if marketplace_version != plugin_version:
                      errors.append(f'{plugin_name}: Version mismatch - plugin.json has {plugin_version}, marketplace.json has {marketplace_version}')
                  else:
                      print(f'{plugin_name}: Version {plugin_version} synchronized')
              else:
                  print(f'{plugin_name}: Not in marketplace.json (standalone plugin)')

          if errors:
              print('\nVersion synchronization errors:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)
          else:
              print('\nAll versions are synchronized!')
          "

  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install ruff
        run: pip install ruff==0.14.10

      - name: Ruff lint check
        run: |
          ruff check plugins/*/tools/*/src/ plugins/*/tools/*/tests/ tests/ --output-format=github

      - name: Ruff format check
        run: |
          ruff format --check plugins/*/tools/*/src/ plugins/*/tools/*/tests/ tests/

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          markdownlint '**/*.md' --ignore 'node_modules/**' --ignore '.git/**' --ignore 'output/**' --ignore 'tests/fixtures/**'

  plugin-validate:
    name: Validate Plugins (official CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Validates plugin.json manifests, marketplace.json, and command/skill frontmatter using
    # the official `claude plugin validate` subcommand (auth-free — no secrets needed).
    # Strict mode runs against the three plugin directories so CI fails on unrecognized
    # fields, missing metadata, or other issues the runtime otherwise tolerates. The
    # marketplace manifest is validated non-strict: its metadata.marketplace_version and
    # metadata.schema_version fields are house bookkeeping that Claude Code ignores at load
    # time (repo-local version tracking, not a loader contract), so --strict would fail on
    # them for no functional benefit.
    #
    # The @anthropic-ai/claude-code version below is pinned deliberately and must only be
    # bumped as a conscious action (verify locally first) — never let it float to `@latest`.
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Check eval-mapping (evals/**/*.eval.md -> live skill/command)
        # Stdlib-only script -- no Python setup step needed on ubuntu-latest.
        # Fails the build if any eval file references a skill/command that no
        # longer exists (see IMPLEMENTATION_PLAN.md 8.3 / arch-review SA-006).
        run: python3 scripts/check_eval_mapping.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.204

      - name: Validate personal-plugin (strict)
        run: claude plugin validate --strict ./plugins/personal-plugin

      - name: Validate bpmn-plugin (strict)
        run: claude plugin validate --strict ./plugins/bpmn-plugin

      - name: Validate slide-gen (strict)
        run: claude plugin validate --strict ./plugins/slide-gen

      - name: Validate marketplace manifest (non-strict)
        # Non-strict: see job-level comment above re: metadata.*_version fields.
        run: claude plugin validate .
